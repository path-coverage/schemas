# Tests the schemas against the samples, then publishes them on GitHub
# Pages under v1/, the URLs their $ids name, with an index page linking
# them, on each push to main.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bin/test.sh
      - run: |
          mkdir -p site/v1
          cp pages/index.html site/
          cp path_coverage.schema.json path_coverage.source.schema.json site/v1/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
