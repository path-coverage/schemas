# Tests the schemas, then publishes the validator image, validate.py with
# the schemas beside it, to the GitHub container registry on each push to
# main, tagged latest and with the commit, for amd64, eg CI runners, and
# arm64, eg Apple silicon Macs.
name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bin/test.sh
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - run: |
          image=ghcr.io/path-coverage/schemas
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --tag "${image}:latest" --tag "${image}:${GITHUB_SHA::7}" .
